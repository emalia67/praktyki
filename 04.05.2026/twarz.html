<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Usługi kosmetyczne</title>
</head>
<body>
    <nav>
        <h2>W ofercie</h2>
        <ul>
            <li><a href="twarz.html">Zabiegi na twarz</a></li>
                    <ol>
                    <li>Piling</li>
                    <li>Maska</li>
                    <li>Regulacja brwi</li></ol>
            
            <li>Masaż</li>
            <li>Diety oczyszczające</li>
        </ul>
        <a href="index.html">Do strony głównej</a>
    </nav>
    <header>
        <h1>Salon kosmetyczny</h1>
    </header>
    <article>
        <img src="obraz1.jpg" alt="kosmetyczka">
    </article>
    <main>
        <h2>Sprawdź cenę swojej wizyty</h2><br>
        <form>
            <input type="checkbox" name="piling" id="piling">
            <label for="piling">Piling</label><br>
            <input type="checkbox" name="maska" id="maska">
            <label for="maska">Maska</label><br>
            <input type="checkbox" name="masaz" id="masaz">
            <label for="masaz">Masaż twarzy</label><br>
            <input type="checkbox" name="brwi" id="brwi">
            <label for="brwi">Regulacja brwi</label><br>
            <button type="button" onclick="funkcja()">Sprawdź cenę</button>

            <p id="wynik"></p>

            <script>

                function funkcja()
                {
                    var piling = 45;
                    var maska = 30;
                    var masaz = 20;
                    var brwi = 5;
                    var suma = 0;

                    if(document.getElementById('piling').checked == true)
                    {
                        suma += piling;
                    }
                    if(document.getElementById('maska').checked == true)
                    {
                        suma += maska;
                    }
                    if(document.getElementById('masaz').checked == true)
                    {
                        suma += masaz;
                    }
                    if(document.getElementById('brwi').checked == true)
                    {
                        suma += brwi;
                    }  
                    document.getElementById('wynik'). innerHTML = 'Cena zabiegów: ' + suma;
                }

                

            </script>

        </form>
    </main>
    <footer>
        <p>Autor: 000000000000</p>
    </footer>
</body>
</html>
